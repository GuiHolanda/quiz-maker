homepage.hero.line1=Pare de decorar.
homepage.hero.line2=Comece a entender.
homepage.hero.description=Banco de questões acaba, e aí você já sabe a resposta antes de terminar de ler a alternativa. Aqui cada rodada gera questões novas, com o peso que cada domínio tem na sua prova e a explicação de por que cada alternativa está certa ou errada.
