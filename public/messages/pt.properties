pricing.faq.title=Dúvidas frequentes
pricing.faq.subtitle=Tudo o que você precisa saber antes de escolher um plano.
pricing.faq.q1=Posso cancelar a qualquer momento?
pricing.faq.a1=Sim. Você pode cancelar sua assinatura a qualquer momento. O acesso continua até o fim do período de cobrança atual.
pricing.faq.q2=O que acontece quando atinjo o limite de questões?
pricing.faq.a2=Ao atingir o limite, a geração de questões é pausada até a renovação do seu período — a cada 30 dias corridos, contados a partir da criação da sua conta (não o calendário mensal).
pricing.faq.q3=Há trial gratuito para o Pro ou Pro AI?
pricing.faq.a3=Não há trial, mas o plano Gratuito oferece 100 questões para você experimentar a plataforma antes de fazer upgrade.
pricing.faq.q4=Quais formas de pagamento são aceitas?
pricing.faq.a4=Aceitamos cartões de crédito e débito (Visa, Mastercard, American Express) via Stripe, nosso provedor de pagamentos.
pricing.faq.q5=Qual a diferença entre Pro e Pro AI?
pricing.faq.a5=O Pro AI inclui tudo do Pro, além do assistente AI Chat (um assistente conversacional para dúvidas sobre os tópicos do exame), um limite maior de questões a cada 30 dias (2.000 vs. 1.000), mais exames simultâneos (12 vs. 6) e mais exames configurados pela IA por período (30 vs. 15).
pricing.cta2.title=Comece a se preparar de forma mais inteligente hoje
pricing.cta2.subtitle=Junte-se a milhares de profissionais que usam IA para passar em certificações com mais rapidez.
pricing.cta2.disclaimer=Plano gratuito sem cartão de crédito. Cancele planos pagos a qualquer momento.
