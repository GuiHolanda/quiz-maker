homepage.cta.seeDemo=Ver demonstração
homepage.cta.myQuestions=Ver minhas questões
homepage.concursos.title=Concursos públicos, do jeito que a banca cobra
homepage.concursos.subtitle=Cada banca tem seu estilo. Geramos questões calibradas para o formato exato de quem organiza a sua prova.
homepage.concursos.whyTitle=Por que estudar por banca importa
homepage.concursos.whyBody=A mesma matéria é cobrada de formas diferentes por cada banca. CESPE/CEBRASPE trabalha com itens Certo/Errado e pegadinhas de literalidade; FCC e FGV preferem múltipla escolha densa. Treinar no formato certo é metade da aprovação.
homepage.concursos.bancasLabel=Estilo por banca
homepage.concursos.flowLabel=Como funciona para concursos
homepage.concursos.flow.step1Title=Cole o edital
homepage.concursos.flow.step1Body=Envie o edital ou selecione o concurso. A IA mapeia matérias, pesos e cargos automaticamente.
homepage.concursos.flow.step2Title=Escolha a banca
homepage.concursos.flow.step2Body=Selecione a banca organizadora e a IA ajusta o estilo, o nível e o formato das questões.
homepage.concursos.flow.step3Title=Pratique no formato real
homepage.concursos.flow.step3Body=Gere simulados ilimitados com gabarito comentado item a item, no mesmo estilo da prova.
homepage.concursos.areasLabel=Matérias cobertas
homepage.concursos.cta=Começar a praticar para concursos
homepage.certs.title=Cobertura por área
homepage.certs.subtitle=Trilhas prontas em nuvem e finanças. Nas demais áreas, você cria o exame com os tópicos do edital e a IA gera a partir dele.
homepage.certs.featuredProvider=Mais procurada
homepage.howItWorks.title=Como funciona
homepage.howItWorks.subtitle=Em quatro passos, do zero ao simulado calibrado para o seu exame.
homepage.howItWorks.step1Title=Escolha o exame
homepage.howItWorks.step1Body=Trilha pronta ou configuração pelo edital.
homepage.howItWorks.step2Title=Gere e resolva
homepage.howItWorks.step2Body=Questões por assunto e nível, com explicação.
homepage.howItWorks.step3Title=Rode um simulado
homepage.howItWorks.step3Body=No formato e no tempo da prova real.
homepage.howItWorks.step4Title=Treine os pontos fracos
homepage.howItWorks.step4Body=Questões novas onde o diagnóstico aponta.
homepage.faq.title=Perguntas frequentes
homepage.faq.q1=O que a Certifique AI faz?
homepage.faq.a1=Gera questões de prática por IA para certificações e concursos públicos. Você escolhe o exame, configura os tópicos e recebe questões inéditas calibradas ao formato real da prova.
homepage.faq.q2=Quais exames são cobertos?
homepage.faq.a2=TI e cloud (AWS, Azure, GCP, SAP, CompTIA), saúde (residência médica, CRM, COREN), direito (OAB, magistratura, MP), finanças (CPA-10, CPA-20, CFA), engenharia (CREA, CONFEA) e concursos públicos pelas principais bancas.
homepage.faq.q3=As questões são oficiais das bancas?
homepage.faq.a3=Não. São questões originais geradas por IA com base no conteúdo programático oficial — nunca copiadas de provas anteriores. O objetivo é gerar volume e variedade para o treino.
homepage.faq.q4=Como funciona a geração por IA?
homepage.faq.a4=O modelo recebe o conteúdo programático do exame, os pesos por domínio e o nível de dificuldade configurado. Gera questões inéditas, aplica validação automática e entrega já com o raciocínio de cada opção aberto.
homepage.faq.q5=Posso testar antes de pagar?
homepage.faq.a5=Sim. O plano gratuito inclui 100 questões por período, 2 exames do catálogo, simulados e explicações por alternativa — sem inserir cartão de crédito.
homepage.faq.q6=Como funcionam os simulados?
homepage.faq.a6=Você configura o tempo e a distribuição por tópico. O simulado roda no formato da prova real: sem gabarito durante a tentativa e resultado detalhado ao final.
homepage.faq.q7=A plataforma serve para concursos públicos?
homepage.faq.a7=Sim. Suporta concursos com calibração por banca: CESPE/CEBRASPE (Certo/Errado), FGV, FCC, VUNESP e outras. O gerador adapta o estilo e o formato de cada organizadora.
homepage.concursos.kick=Concursos Públicos
homepage.concursos.flow.step4Title=Repita com foco
homepage.concursos.flow.step4Body=Avance nos tópicos onde o diagnóstico identificou mais pontos fracos.
homepage.features.kick=Recursos
homepage.features.title=O que faz a diferença no estudo
homepage.features.simple.n1.title=Questões calibradas ao exame
homepage.features.simple.n1.body=Cada questão é gerada a partir do conteúdo programático oficial, ponderada à distribuição de domínios do seu exame. Formato e nível alinhados ao que realmente cai.
homepage.features.simple.n2.title=Explicação por alternativa
homepage.features.simple.n2.body=Não só qual está certa: você entende por que cada alternativa está certa ou errada. Elimina a memorização e constrói raciocínio real para a prova.
