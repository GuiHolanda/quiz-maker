homepage.quality.kick=Generation and verification
homepage.quality.title=How questions are generated and verified
homepage.quality.source.title=Source: the published syllabus
homepage.quality.source.body=Questions are generated from the editais, certification guides and official syllabi of each exam. No question is copied from a past paper.
homepage.quality.pipeline.title=Validation pipeline
homepage.quality.pipeline.body=Every generated question goes through an automated consistency check: a single correct answer, plausible distractors and alignment to the exam domain.
homepage.quality.review.title=Human review available
homepage.quality.review.body=Questions vetted by specialists are marked as reviewed. How much of the content is AI-generated is shown transparently in the interface.
homepage.quality.report.title=Reportable corrections
homepage.quality.report.body=Found a mistake? Report it right on the question. That feedback feeds the continuous improvement of the generation pipeline.
homepage.quality.disclaimer=Questions generated by Certifique AI are produced by artificial intelligence from publicly available syllabi and do not replace official material from the exam boards. We recommend using them alongside traditional study.

