pricing.faq.title=Frequently asked questions
pricing.faq.subtitle=Everything you need to know before choosing a plan.
pricing.faq.q1=Can I cancel at any time?
pricing.faq.a1=Yes. You can cancel your subscription at any time. Your access will continue until the end of the current billing period.
pricing.faq.q2=What happens when I reach the question limit?
pricing.faq.a2=Once your limit is reached, question generation is paused until your period renews — every 30 rolling days from when your account was created (not the calendar month).
pricing.faq.q3=Is there a free trial for Pro or Pro AI?
pricing.faq.a3=There is no free trial, but the Free plan gives you 100 questions to experience the platform before upgrading.
pricing.faq.q4=What payment methods are accepted?
pricing.faq.a4=We accept credit and debit cards (Visa, Mastercard, American Express) via Stripe, our payment provider.
pricing.faq.q5=What is the difference between Pro and Pro AI?
pricing.faq.a5=Pro AI includes everything in Pro, plus the AI Chat assistant (a conversational assistant you can ask about exam topics), a higher question limit every 30 days (2,000 vs. 1,000), more concurrent exams (12 vs. 6), and more AI-configured exams per period (30 vs. 15).
