homepage.heroCard.tag=AWS SAA-C03 · Storage
homepage.heroCard.stem=An application needs shared storage across several EC2 instances in different Availability Zones. Which service meets the requirement?
homepage.heroCard.correct=Correct
homepage.heroCard.explanation=EFS is a managed, elastic NFS file system reachable from multiple AZs at once. EBS Multi-Attach works within a single AZ, S3 is not a file system, and Storage Gateway targets on-premises environments.
