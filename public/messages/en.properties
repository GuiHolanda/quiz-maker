# ─── Concursos Section (homepage) ──────────────────────────
homepage.concursos.title=Public exams, the way your banca asks them
homepage.concursos.subtitle=Every banca has its own style. We generate questions calibrated to the exact format of whoever runs your exam.
homepage.concursos.whyTitle=Why studying by banca matters
