homepage.faq.title=Frequently asked questions
homepage.faq.q1=What does Certifique AI do?
homepage.faq.a1=It generates AI-powered practice questions for certifications and public exams. You choose the exam, configure topics, and receive original questions calibrated to the real test format.
homepage.faq.q2=Which exams are covered?
homepage.faq.a2=IT and cloud (AWS, Azure, GCP, SAP, CompTIA), healthcare (medical residency, CRM, COREN), law (OAB, judiciary, MP), finance (CPA-10, CPA-20, CFA), engineering (CREA, CONFEA), and public exams by the main boards.
homepage.faq.q3=Are the questions official exam questions?
homepage.faq.a3=No. They are original questions generated by AI based on the official exam curriculum — never copied from past tests. The goal is to provide volume and variety for practice.
homepage.faq.q4=How does AI generation work?
homepage.faq.a4=The model receives the exam syllabus, the per-domain weights and the difficulty level you set. It generates original questions, runs automated validation and delivers them with the reasoning behind each option laid out.
homepage.faq.q5=Can I try before paying?
homepage.faq.a5=Yes. The free plan includes 100 questions per period, 2 catalog exams, mock exams, and per-option explanations — no credit card required.
homepage.faq.q6=How do mock exams work?
homepage.faq.a6=You configure the time and topic distribution. The mock exam runs in the real test format: no answer key during the attempt, detailed results at the end.
homepage.faq.q7=Does the platform work for public sector exams?
homepage.faq.a7=Yes. Supports public exams calibrated by board: CESPE/CEBRASPE (True/False), FGV, FCC, VUNESP, and others. The generator adapts the style and format of each board.
